title: Your awesome title
author: GitHub User
email: irelia@zjnu.edu.cn
description: >
  Jili Chen (陈继力) - Ph.D. student at Zhejiang Normal University, School of Mathematics and Computer Science, Department of Computer Science and Technology.
  Research interests: diffusion models, intelligent education, affective computing, causal inference, large language models.
  Publications, patents, projects, and personal blog links are available here.
show_excerpts: true # set to true to show excerpts on the homepage

# Minima date format
# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
sass:
  sass_dir: _sass
plainwhite:
  name: Jili Chen
  tagline: Postgraduate. Researcher. Developer.
  date_format: "%b %-d, %Y"
  sitemap: true # set to true to generate sitemap.xml content
  search: true # set to true to enable searchbar
  dark_mode: true # set to true to add dark mode toggle
  portfolio_image: "assets/portfolio.png" # the path from the base directory of the site to the image to display (no / at the start)
  portfolio_image_dark: "assets/portfolio_dark.png"
  html_lang: "en" # set the lang attribute of the <html> tag for the pages. See here for a list of codes: https://www.w3schools.com/tags/ref_country_codes.asp
  condensed_mobile:
    - home
    - page
    - post
    - awards
    - publications
    - projects
    - patents
  # generate social links in footer
  social_links:
