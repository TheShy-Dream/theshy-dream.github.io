name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        env:
          GOOGLE_SCHOLAR_ID: et0_rK4AAAAJ
          OUTPUT_DIR: ${{ runner.temp }}/scholar-data
        run: python google_scholar_crawler/main.py

      - name: Publish citation data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${RUNNER_TEMP}/scholar-data"
          git init
          git checkout -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-scholar.json
          git commit -m "Update Google Scholar citation data"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats
